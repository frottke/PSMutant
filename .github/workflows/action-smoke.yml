name: Composite action smoke

on:
  push:
    paths:
      - action.yml
      - action/**
      - PSMutant.psd1
      - tests/Action.Tests.ps1
      - tests/fixtures/action-smoke/**
      - .github/workflows/action-smoke.yml
  pull_request:
    paths:
      - action.yml
      - action/**
      - PSMutant.psd1
      - tests/Action.Tests.ps1
      - tests/fixtures/action-smoke/**
      - .github/workflows/action-smoke.yml

permissions:
  contents: read

jobs:
  action-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify version resolution and Gallery installation contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . ./action/Invoke-Action.ps1
          $pester = Resolve-ActionPesterVersion
          Import-ActionGalleryModule -Name Pester -Version $pester
          $r = Invoke-Pester -Path ./tests/Action.Tests.ps1 -PassThru
          if ($r.FailedCount -ne 0 -or $r.PassedCount -eq 0) {
            throw "Action tests failed: $($r.FailedCount) failed, $($r.PassedCount) passed."
          }

      - name: Determine whether pinned module version is published
        id: release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . ./action/Invoke-Action.ps1
          $version = Get-ActionPSMutantVersion -ActionPath $env:GITHUB_WORKSPACE
          $releases = @(Find-Module -Name PSMutant -AllVersions -Repository PSGallery -ErrorAction Stop)
          $published = @($releases | Where-Object { [string]$_.Version -eq $version }).Count -gt 0
          "published=$($published.ToString().ToLowerInvariant())" }} $env:GITHUB_OUTPUT
          if (-not $published) {
            Write-Host "::notice::PSMutant $version has not been published. The pinned action end-to-end smoke requires a published release."
            "Full action smoke skipped: PSMutant $version is not published in PSGallery." }} $env:GITHUB_STEP_SUMMARY
          }

      - name: Execute pinned composite action
        if: steps.release.outputs.published == 'true'
        id: mutation
        uses: ./
        with:
          config-file: tests/fixtures/action-smoke/psmutant.config.json
          source-root: tests/fixtures/action-smoke
          mode: full

      - name: Verify actual mutation score and pinned module version
        if: steps.release.outputs.published == 'true'
        shell: pwsh
        env:
          TOTAL: ${{ steps.mutation.outputs.total }}
          KILLED: ${{ steps.mutation.outputs.killed }}
          SURVIVED: ${{ steps.mutation.outputs.survived }}
          LOADED: ${{ steps.mutation.outputs.psmutant-version }}
        run: |
          $expected = (Import-PowerShellDataFile ./PSMutant.psd1).ModuleVersion
          if ($env:LOADED -ne [string]$expected) { throw "Expected PSMutant $expected, got $env:LOADED" }
          if ([int]$env:TOTAL -lt 2 -or [int]$env:KILLED -lt 1 -or [int]$env:SURVIVED -lt 1) { throw 'No meaningful mutation score was produced.' }

      - name: Verify threshold violation fails the action
        if: steps.release.outputs.published == 'true'
        id: reject
        continue-on-error: true
        uses: ./
        with:
          config-file: tests/fixtures/action-smoke/psmutant.fail.config.json
          source-root: tests/fixtures/action-smoke
          mode: full

      - name: Verify expected failure verdict
        if: always() && steps.release.outputs.published == 'true'
        shell: pwsh
        env:
          OUTCOME: ${{ steps.reject.outcome }}
          REASON: ${{ steps.reject.outputs.failure-reason }}
          EXIT_CODE: ${{ steps.reject.outputs.exit-code }}
        run: |
          if ($env:OUTCOME -ne 'failure' -or $env:REASON -ne 'BelowThreshold' -or $env:EXIT_CODE -ne '1') { throw "Unexpected gate verdict: $env:OUTCOME, $env:REASON, $env:EXIT_CODE" }
